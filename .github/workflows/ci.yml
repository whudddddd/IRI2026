name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y gfortran cmake
      - name: Install package
        run: python -m pip install -e ".[tests]"
      - name: Run tests
        run: python -m pytest
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
