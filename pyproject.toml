[build-system]
requires = ["setuptools>=68", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "iri2026"
version = "1.0.0"
description = "IRI2026 International Reference Ionosphere from Python"
keywords = ["thermosphere", "ionosphere"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Programming Language :: Fortran",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = ["numpy", "xarray", "python-dateutil"]

[project.optional-dependencies]
tests = ["pytest", "matplotlib"]
lint = ["ruff", "mypy", "types-python-dateutil"]

[project.urls]
Homepage = "https://github.com/space-physics/iri2026"
Repository = "https://github.com/space-physics/iri2026"
Issues = "https://github.com/space-physics/iri2026/issues"

[project.scripts]
iri2026-altitude = "iri2026.altitude:cli"
iri2026-latitude = "iri2026.latitude:cli"
iri2026-times = "iri2026.times:cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["iri2026*"]

[tool.setuptools.package-data]
iri2026 = ["CMakeLists.txt", "src/*", "data/*", "*.exe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 99

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
